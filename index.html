<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Pink Beauty | Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink-vibrant: #ff2d88; --bg: #ffffff; --text: #000000; }
        body.dark-mode { --bg: #0f0f0f; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; color: var(--text); }
        .app-shell { width: 100%; max-width: 500px; height: 100vh; position: relative; margin: auto; overflow: hidden; }
        .bg-layer { position: absolute; top: 0; width: 100%; height: 100%; background: #ffccd5; clip-path: polygon(100% 0, 100% 60%, 0 100%, 0 0); z-index: 1; transition: 0.8s; }
        header { position: absolute; top: 40px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; z-index: 5000; }
        .track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide { min-width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; position: relative; z-index: 10; }
        .slide img { max-width: 80%; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.15)); }
        .add-btn { background: var(--text); color: var(--bg); border: none; padding: 18px; width: 260px; font-weight: 700; border-radius: 4px; margin-top: 20px; cursor: pointer; }
        .cart-page { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--bg); z-index: 10000; transition: 0.5s; padding: 80px 25px; }
        .cart-page.active { right: 0; }
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 20px; width: 100%; font-weight: 700; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body class="dark-mode">
    <div class="app-shell">
        <div class="bg-layer" id="bg-master"></div>
        <header>
            <div style="font-family:'Bodoni Moda'; font-size:22px;">All Pink Beauty</div>
            <div onclick="toggleCart()" style="cursor:pointer; position:relative;">🛒 <span id="badge" style="position:absolute; top:-10px; right:-10px; background:var(--pink-vibrant); border-radius:50%; width:18px; height:18px; font-size:10px; display:none; align-items:center; justify-content:center;">0</span></div>
        </header>

        <div class="track" id="track"></div>

        <div class="cart-page" id="cartPage">
            <h2 style="font-family:'Bodoni Moda'; font-size:30px;">Sacola</h2>
            <div id="cartItems" style="margin: 30px 0;"></div>
            <p>TOTAL: <b id="totalDisplay">R$ 0,00</b></p>
            <button class="whatsapp-btn" onclick="checkout()">PEDIR NO WHATSAPP</button>
            <p onclick="toggleCart()" style="margin-top:30px; text-align:center; cursor:pointer;">Voltar</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "all-pink-beauty.firebaseapp.com",
            databaseURL: "https://all-pink-beauty-default-rtdb.firebaseio.com",
            projectId: "all-pink-beauty",
            storageBucket: "all-pink-beauty.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let index = 0;
        let cart = [];
        let prods = [];

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            if (!data) return;
            // FILTRO: Só mostra se estoque > 0
            prods = Object.values(data).filter(p => (p.estoque || 0) > 0);
            render();
        });

        function render() {
            const track = document.getElementById('track');
            track.innerHTML = prods.map((p, i) => `
                <div class="slide">
                    <img src="${p.foto}">
                    <h3 style="margin-top:20px;">${p.nome}</h3>
                    <p style="color:var(--pink-vibrant); font-weight:bold; font-size:20px;">R$ ${p.preco.toFixed(2)}</p>
                    <button class="add-btn" onclick="addToCart(${i})">ADICIONAR À SACOLA</button>
                </div>
            `).join('');
            update();
        }

        function update() { 
            document.getElementById('track').style.transform = `translateX(-${index * 100}%)`;
            document.getElementById('bg-master').style.background = prods[index]?.cor || '#ffccd5';
        }

        window.addToCart = (i) => { cart.push(prods[i]); updateUI(); };
        
        function updateUI() {
            const badge = document.getElementById('badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
            const total = cart.reduce((acc, p) => acc + p.preco, 0);
            document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('cartItems').innerHTML = cart.map(p => `<p>${p.nome} - R$ ${p.preco.toFixed(2)}</p>`).join('');
        }

        window.toggleCart = () => document.getElementById('cartPage').classList.toggle('active');

        window.checkout = () => {
            const msg = encodeURIComponent(`*Novo Pedido*\n${cart.map(p => `• ${p.nome}`).join('\n')}\n\n*Total: R$ ${cart.reduce((a,b)=>a+b.preco,0).toFixed(2)}*`);
            window.open(`https://wa.me/5511965972240?text=${msg}`);
        };

        // Swipe
        let x = 0;
        document.body.addEventListener('touchstart', e => x = e.touches[0].clientX);
        document.body.addEventListener('touchend', e => {
            const d = x - e.changedTouches[0].clientX;
            if(Math.abs(d) > 50) {
                if(d > 0 && index < prods.length-1) index++;
                else if(d < 0 && index > 0) index--;
                update();
            }
        });
    </script>
</body>
</html>
