<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff2d88">
    <title>All Pink Beauty | Luxury Experience</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icone.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-vibrant: #ff2d88;
            --pink-soft: #ffccd5;
            --bg-app: #ffffff;
            --text-main: #000000;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body.dark-mode {
            --bg-app: #0f0f0f;
            --text-main: #ffffff;
            --pink-soft: #4a0e2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html {
            background-color: #0f0f0f;
            height: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
        }
        html.light-mode { background-color: #ffffff; }
        body {
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            height: 100%;
            display: flex;
            justify-content: center;
            transition: background 0.5s var(--ease);
        }
        .app-shell {
            width: 100%;
            max-width: 500px;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            height: 100%;
            background: var(--bg-app);
            position: fixed;
            inset: 0;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
        }
        .bg-layer {
            position: absolute;
            top: 0; right: 0; left: 0; bottom: 0;
            width: 100%;
            background: var(--pink-soft);
            clip-path: polygon(100% 0, 100% 60%, 0 100%, 0 0);
            transition: background 0.8s var(--ease);
            z-index: 1;
        }
        header {
            position: absolute;
            top: env(safe-area-inset-top, 40px);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 5000;
        }
        .logo-container { height: 60px; display: flex; align-items: center; }
        .logo-img { max-height: 100%; width: auto; object-fit: contain; }
        .logo-text { font-family: 'Bodoni Moda', serif; font-size: 24px; color: var(--text-main); font-weight: 700; }
        .header-actions { display: flex; gap: 20px; align-items: center; }
        .theme-toggle { cursor: pointer; font-size: 24px; color: var(--text-main); border: none; background: none; }
        .cart-btn { cursor: pointer; position: relative; color: var(--text-main); border: none; background: none; }
        .cart-icon-svg { width: 24px; height: 24px; border: 2px solid currentColor; border-top: none; position: relative; }
        .cart-icon-svg::after {
            content: ''; position: absolute; top: -9px; left: 5px;
            width: 10px; height: 8px; border: 2px solid currentColor;
            border-bottom: none; border-radius: 10px 10px 0 0;
        }
        .badge {
            position: absolute; top: -5px; right: -8px;
            background: var(--pink-vibrant); color: white;
            font-size: 11px; min-width: 20px; height: 20px; padding: 0 4px;
            border-radius: 50%; display: none;
            justify-content: center; align-items: center; font-weight: bold;
        }
        .viewport { width: 100%; height: 100%; position: relative; z-index: 10; overflow: hidden; }
        .track { display: flex; height: 100%; transition: transform 0.6s var(--ease); will-change: transform; }
        .slide {
            min-width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 100px 20px calc(40px + env(safe-area-inset-bottom, 0px));
            text-align: center;
        }
        .product-frame {
            height: 45vh; width: 100%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }
        .product-frame img {
            max-width: 85%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            opacity: 0; transform: scale(0.3);
        }
        .slide.active img { animation: growIn 0.8s var(--bounce) forwards; }
        @keyframes growIn {
            0% { transform: scale(0.3) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .meta { color: var(--text-main); transition: 0.6s; opacity: 0; transform: translateY(20px); }
        .slide.active .meta { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
        .meta h3 { font-family: 'Bodoni Moda', serif; font-size: 20px; margin-bottom: 6px; }
        .meta .description {
            font-size: 13px;
            font-weight: 300;
            opacity: 0.75;
            line-height: 1.5;
            margin-bottom: 10px;
            max-height: 60px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            padding: 0 10px;
        }
        .price { color: var(--pink-vibrant); font-weight: 600; font-size: 22px; display: block; margin-bottom: 16px; }
        .add-btn {
            background: var(--text-main); color: var(--bg-app);
            border: none; padding: 20px; width: 280px;
            font-size: 14px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; border-radius: 4px;
        }
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 30; width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--text-main); background: var(--bg-app);
            color: var(--text-main); font-size: 28px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0.6; transition: opacity 0.2s;
        }
        .nav-btn:hover { opacity: 1; }
        .nav-btn:disabled { opacity: 0.15; cursor: default; }
        .nav-prev { left: 12px; }
        .nav-next { right: 12px; }
        .dots {
            position: absolute;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px; z-index: 20;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-main); opacity: 0.25;
            transition: 0.3s var(--ease); border: none; padding: 0; cursor: pointer;
        }
        .dot.active { opacity: 1; transform: scale(1.2); background: var(--pink-vibrant); }
        .cart-page {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg-app); z-index: 10000;
            transition: 0.5s var(--ease); padding: 100px 25px 40px;
            display: flex; flex-direction: column;
        }
        .cart-page.active { right: 0; }
        .cart-page .bg-layer { opacity: 0.5; pointer-events: none; }
        .close-x {
            position: absolute; top: 40px; right: 30px;
            font-size: 40px; cursor: pointer; color: var(--text-main); z-index: 10;
            border: none; background: none;
        }
        .cart-content {
            position: relative; z-index: 5; height: 100%;
            display: flex; flex-direction: column; color: var(--text-main);
        }
        .cart-list { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.1);
        }
        .prod-thumb {
            width: 60px; height: 60px; background: #fff;
            border-radius: 8px; overflow: hidden;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .prod-thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .qty-controls {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .qty-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--text-main); background: transparent;
            color: var(--text-main); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-value { min-width: 20px; text-align: center; font-weight: 600; }
        .whatsapp-btn {
            background: #25D366; color: white; border: none;
            padding: 22px; width: 100%; font-weight: 700;
            text-transform: uppercase; border-radius: 8px; font-size: 16px;
            cursor: pointer;
        }
        .clear-cart-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--text-main);
            padding: 12px; width: 100%; font-weight: 600; border-radius: 8px;
            font-size: 13px; cursor: pointer; margin-bottom: 12px; text-transform: uppercase;
        }
        .empty-msg { opacity: 0.5; text-align: center; margin-top: 40px; }
        .loading-msg { opacity: 0.7; text-align: center; margin-top: 40px; font-size: 14px; }
        .error-msg { color: #ff6b6b; text-align: center; margin-top: 40px; font-size: 14px; padding: 0 20px; }
    </style>
</head>
<body class="dark-mode">
    <div class="app-shell">
        <div class="bg-layer" id="bg-master"></div>
        <header>
            <div class="logo-container">
                <img src="logotipobranco-Photoroom.png" class="logo-img" alt="Logo All Pink Beauty"
                     onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
                <span id="logoFallback" class="logo-text" style="display:none;">All Pink Beauty</span>
            </div>
            <div class="header-actions">
                <button type="button" class="theme-toggle" onclick="toggleTheme()" id="themeIcon" aria-label="Alternar tema">☀️</button>
                <button type="button" class="cart-btn" onclick="toggleCart()" aria-label="Abrir carrinho">
                    <div class="cart-icon-svg"></div>
                    <div class="badge" id="badge">0</div>
                </button>
            </div>
        </header>
        <div class="viewport" id="viewport">
            <button type="button" class="nav-btn nav-prev" id="navPrev" onclick="navigate(-1)" aria-label="Produto anterior">‹</button>
            <button type="button" class="nav-btn nav-next" id="navNext" onclick="navigate(1)" aria-label="Próximo produto">›</button>
            <div class="track" id="track"><p class="loading-msg">Carregando produtos...</p></div>
            <div class="dots" id="dots"></div>
        </div>
        <div class="cart-page" id="cartPage">
            <div class="bg-layer" id="bg-cart"></div>
            <button type="button" class="close-x" onclick="toggleCart()" aria-label="Fechar carrinho">✕</button>
            <div class="cart-content">
                <h2 style="font-family:'Bodoni Moda'; font-size:35px; margin-bottom:10px">Seu Carrinho</h2>
                <div class="cart-list" id="cartItems"></div>
                <div style="padding-top:20px; border-top:2px solid var(--text-main);">
                    <p style="font-weight:600; font-size:20px; display:flex; justify-content:space-between; margin-bottom:20px;">
                        TOTAL: <span id="totalDisplay">R$ 0,00</span>
                    </p>
                    <button type="button" class="clear-cart-btn" id="clearCartBtn" onclick="clearCart()" style="display:none;">Limpar carrinho</button>
                    <button type="button" class="whatsapp-btn" onclick="checkout()">PEDIR NO WHATSAPP</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.app",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52"
        };

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str ?? '';
            return d.innerHTML;
        }

        function formatPrice(n) {
            return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let prods = [];
        let cart = loadCart();
        let index = 0;

        const track = document.getElementById('track');
        const dotsEl = document.getElementById('dots');
        const badge = document.getElementById('badge');
        const bgMaster = document.getElementById('bg-master');
        const bgCart = document.getElementById('bg-cart');
        const navPrev = document.getElementById('navPrev');
        const navNext = document.getElementById('navNext');

        function loadCart() {
            try {
                const saved = localStorage.getItem('allpink-cart');
                if (!saved) return {};
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) || typeof parsed !== 'object') return {};
                return parsed;
            } catch {
                return {};
            }
        }

        function saveCart() {
            localStorage.setItem('allpink-cart', JSON.stringify(cart));
        }

        function cartCount() {
            return Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
        }

        function cartTotal() {
            return Object.values(cart).reduce((sum, item) => sum + Number(item.preco) * item.qty, 0);
        }

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            if (!data) {
                track.innerHTML = '<p class="empty-msg">Nenhum produto cadastrado.</p>';
                dotsEl.innerHTML = '';
                navPrev.disabled = true;
                navNext.disabled = true;
                return;
            }
            prods = Object.entries(data)
                .map(([id, p]) => ({ id, ...p }))
                .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

            if (index >= prods.length) index = 0;

            track.innerHTML = prods.map((p, i) => `
                <div class="slide ${i === index ? 'active' : ''}" data-bg="${esc(p.cor || '#4a0e2a')}">
                    <div class="product-frame"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy"></div>
                    <div class="meta">
                        <h3>${esc(p.nome)}</h3>
                        ${p.descricao ? `<p class="description">${esc(p.descricao)}</p>` : ''}
                        <span class="price">R$ ${formatPrice(p.preco)}</span>
                        <button type="button" class="add-btn" onclick="addToCart('${esc(p.id)}')">ADICIONAR AO CARRINHO</button>
                    </div>
                </div>
            `).join('');

            dotsEl.innerHTML = prods.map((_, i) =>
                `<button type="button" class="dot ${i === index ? 'active' : ''}" onclick="goTo(${i})" aria-label="Produto ${i + 1}"></button>`
            ).join('');

            updateLayout();
        }, (err) => {
            console.error(err);
            track.innerHTML = '<p class="error-msg">Erro ao carregar produtos. Verifique sua conexão com a internet.</p>';
            navPrev.disabled = true;
            navNext.disabled = true;
        });

        window.goTo = (i) => {
            index = i;
            updateLayout();
        };

        window.navigate = (delta) => {
            const next = index + delta;
            if (next >= 0 && next < prods.length) {
                index = next;
                updateLayout();
            }
        };

        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.documentElement.classList.toggle('light-mode', !isDark);
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('allpink-theme', isDark ? 'dark' : 'light');
        };

        const savedTheme = localStorage.getItem('allpink-theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
            document.documentElement.classList.add('light-mode');
            document.getElementById('themeIcon').textContent = '🌙';
        }

        let startX = 0;
        document.getElementById('viewport').addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        }, { passive: true });

        document.getElementById('viewport').addEventListener('touchend', e => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) navigate(1);
                else navigate(-1);
            }
        });

        document.addEventListener('keydown', e => {
            if (document.getElementById('cartPage').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        function updateLayout() {
            const slides = document.querySelectorAll('.slide');
            if (!slides.length) return;

            track.style.transform = `translateX(-${index * 100}%)`;
            const color = prods[index]?.cor || '#4a0e2a';
            bgMaster.style.background = color;
            bgCart.style.background = color;

            navPrev.disabled = index === 0;
            navNext.disabled = index >= prods.length - 1;

            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));

            slides.forEach((s, i) => {
                const img = s.querySelector('img');
                if (i === index) {
                    s.classList.add('active');
                    if (img) {
                        img.style.animation = 'none';
                        void img.offsetHeight;
                        img.style.animation = '';
                    }
                } else {
                    s.classList.remove('active');
                }
            });
        }

        window.addToCart = (id) => {
            const p = prods.find(x => x.id === id);
            if (!p) return;
            if (cart[id]) cart[id].qty++;
            else cart[id] = { id: p.id, nome: p.nome, preco: p.preco, foto: p.foto, qty: 1 };
            saveCart();
            updateCartUI();
        };

        window.changeQty = (id, delta) => {
            if (!cart[id]) return;
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];
            saveCart();
            updateCartUI();
        };

        window.clearCart = () => {
            if (!cartCount()) return;
            if (confirm('Limpar todos os itens do carrinho?')) {
                cart = {};
                saveCart();
                updateCartUI();
            }
        };

        function updateCartUI() {
            const count = cartCount();
            badge.textContent = count;
            badge.style.display = count > 0 ? 'flex' : 'none';

            const list = document.getElementById('cartItems');
            const items = Object.values(cart);

            document.getElementById('clearCartBtn').style.display = items.length ? 'block' : 'none';

            if (!items.length) {
                list.innerHTML = '<p class="empty-msg">Sua sacola está vazia.</p>';
            } else {
                list.innerHTML = items.map(item => `
                    <div class="cart-item">
                        <div class="prod-thumb"><img src="${esc(item.foto)}" alt="${esc(item.nome)}"></div>
                        <div style="flex-grow:1; min-width:0;">
                            <strong>${esc(item.nome)}</strong><br>
                            <small>R$ ${formatPrice(item.preco)}</small>
                        </div>
                        <div class="qty-controls">
                            <button type="button" class="qty-btn" onclick="changeQty('${esc(item.id)}', -1)" aria-label="Diminuir">−</button>
                            <span class="qty-value">${item.qty}</span>
                            <button type="button" class="qty-btn" onclick="changeQty('${esc(item.id)}', 1)" aria-label="Aumentar">+</button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('totalDisplay').textContent = `R$ ${formatPrice(cartTotal())}`;
        }

        window.toggleCart = () => document.getElementById('cartPage').classList.toggle('active');

        window.checkout = () => {
            const items = Object.values(cart);
            if (!items.length) return alert('Seu carrinho está vazio!');
            const numero = '5511965972240';
            let msg = '*Novo Pedido - All Pink Beauty*\n\n';
            items.forEach(item => {
                const sub = Number(item.preco) * item.qty;
                msg += `• ${item.nome} x${item.qty} - R$ ${formatPrice(sub)}\n`;
            });
            msg += `\n*Total: R$ ${formatPrice(cartTotal())}*`;
            window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`);
        };

        updateCartUI();
    </script>
</body>
</html>
