<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff2d88">
    <title>All Pink Beauty | Luxury Experience</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-vibrant: #ff2d88;
            --pink-soft: #ffccd5;
            --bg-app: #ffffff;
            --text-main: #000000;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body.dark-mode {
            --bg-app: #0f0f0f;
            --text-main: #ffffff;
            --pink-soft: #4a0e2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            transition: background 0.5s var(--ease);
        }
        .app-shell {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: var(--bg-app);
            position: relative;
            overflow: hidden;
        }
        .bg-layer {
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background: var(--pink-soft);
            clip-path: polygon(100% 0, 100% 60%, 0 100%, 0 0);
            transition: background 0.8s var(--ease);
            z-index: 1;
        }
        header {
            position: absolute;
            top: env(safe-area-inset-top, 40px);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 5000;
        }
        .logo-container { height: 60px; display: flex; align-items: center; }
        .logo-img { max-height: 100%; width: auto; object-fit: contain; }
        .logo-text { font-family: 'Bodoni Moda', serif; font-size: 24px; color: var(--text-main); font-weight: 700; }
        .header-actions { display: flex; gap: 20px; align-items: center; }
        .theme-toggle { cursor: pointer; font-size: 24px; color: var(--text-main); }
        .cart-btn { cursor: pointer; position: relative; color: var(--text-main); }
        .cart-icon-svg { width: 24px; height: 24px; border: 2px solid currentColor; border-top: none; position: relative; }
        .cart-icon-svg::after {
            content: ''; position: absolute; top: -9px; left: 5px;
            width: 10px; height: 8px; border: 2px solid currentColor;
            border-bottom: none; border-radius: 10px 10px 0 0;
        }
        .badge {
            position: absolute; top: -5px; right: -8px;
            background: var(--pink-vibrant); color: white;
            font-size: 11px; width: 20px; height: 20px;
            border-radius: 50%; display: none;
            justify-content: center; align-items: center; font-weight: bold;
        }
        .viewport { width: 100%; height: 100%; position: relative; z-index: 10; overflow: hidden; }
        .track { display: flex; height: 100%; transition: transform 0.6s var(--ease); will-change: transform; }
        .slide {
            min-width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 100px 20px 40px; text-align: center;
        }
        .product-frame {
            height: 45vh; width: 100%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }
        .product-frame img {
            max-width: 85%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            opacity: 0; transform: scale(0.3);
        }
        .slide.active img { animation: growIn 0.8s var(--bounce) forwards; }
        @keyframes growIn {
            0% { transform: scale(0.3) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .meta { color: var(--text-main); transition: 0.6s; opacity: 0; transform: translateY(20px); }
        .slide.active .meta { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
        .meta h3 { font-family: 'Bodoni Moda', serif; font-size: 28px; margin-bottom: 5px; }
        .price { color: var(--pink-vibrant); font-weight: 600; font-size: 24px; display: block; margin-bottom: 20px; }
        .add-btn {
            background: var(--text-main); color: var(--bg-app);
            border: none; padding: 20px; width: 280px;
            font-size: 14px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; border-radius: 4px;
        }
        .dots {
            position: absolute; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px; z-index: 20;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-main); opacity: 0.25;
            transition: 0.3s var(--ease);
        }
        .dot.active { opacity: 1; transform: scale(1.2); background: var(--pink-vibrant); }
        .cart-page {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg-app); z-index: 10000;
            transition: 0.5s var(--ease); padding: 100px 25px 40px;
            display: flex; flex-direction: column;
        }
        .cart-page.active { right: 0; }
        .cart-page .bg-layer { opacity: 0.5; pointer-events: none; }
        .close-x {
            position: absolute; top: 40px; right: 30px;
            font-size: 40px; cursor: pointer; color: var(--text-main); z-index: 10;
        }
        .cart-content {
            position: relative; z-index: 5; height: 100%;
            display: flex; flex-direction: column; color: var(--text-main);
        }
        .cart-list { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.1);
        }
        .prod-thumb {
            width: 60px; height: 60px; background: #fff;
            border-radius: 8px; overflow: hidden;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .prod-thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .whatsapp-btn {
            background: #25D366; color: white; border: none;
            padding: 22px; width: 100%; font-weight: 700;
            text-transform: uppercase; border-radius: 8px; font-size: 16px;
            cursor: pointer;
        }
        .empty-msg { opacity: 0.5; text-align: center; margin-top: 40px; }
    </style>
</head>
<body class="dark-mode">
    <div class="app-shell">
        <div class="bg-layer" id="bg-master"></div>
        <header>
            <div class="logo-container">
                <img src="logotipobranco-Photoroom.jpg" class="logo-img" alt="Logo"
                     onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
                <span id="logoFallback" class="logo-text" style="display:none;">All Pink Beauty</span>
            </div>
            <div class="header-actions">
                <div class="theme-toggle" onclick="toggleTheme()" id="themeIcon">☀️</div>
                <div class="cart-btn" onclick="toggleCart()">
                    <div class="cart-icon-svg"></div>
                    <div class="badge" id="badge">0</div>
                </div>
            </div>
        </header>
        <div class="viewport" id="viewport">
            <div class="track" id="track"></div>
            <div class="dots" id="dots"></div>
        </div>
        <div class="cart-page" id="cartPage">
            <div class="bg-layer" id="bg-cart"></div>
            <div class="close-x" onclick="toggleCart()">✕</div>
            <div class="cart-content">
                <h2 style="font-family:'Bodoni Moda'; font-size:35px; margin-bottom:10px">Seu Carrinho</h2>
                <div class="cart-list" id="cartItems"></div>
                <div style="padding-top:20px; border-top:2px solid var(--text-main);">
                    <p style="font-weight:600; font-size:20px; display:flex; justify-content:space-between; margin-bottom:20px;">
                        TOTAL: <span id="totalDisplay">R$ 0,00</span>
                    </p>
                    <button class="whatsapp-btn" onclick="checkout()">PEDIR NO WHATSAPP</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }
        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.app",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let prods = [];
        let cart = [];
        let index = 0;
        const track = document.getElementById('track');
        const dotsEl = document.getElementById('dots');
        const badge = document.getElementById('badge');
        const bgMaster = document.getElementById('bg-master');
        const bgCart = document.getElementById('bg-cart');
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str ?? '';
            return d.innerHTML;
        }
        function formatPrice(n) {
            return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            if (!data) {
                track.innerHTML = '<p class="empty-msg">Nenhum produto cadastrado.</p>';
                return;
            }
            prods = Object.entries(data)
                .map(([id, p]) => ({ id, ...p }))
                .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
            if (index >= prods.length) index = 0;
            track.innerHTML = prods.map((p, i) => `
                <div class="slide ${i === index ? 'active' : ''}" data-bg="${esc(p.cor || '#4a0e2a')}">
                    <div class="product-frame"><img src="${esc(p.foto)}" alt="${esc(p.nome)}"></div>
                    <div class="meta">
                        <h3>${esc(p.nome)}</h3>
                        <span class="price">R$ ${formatPrice(p.preco)}</span>
                        <button class="add-btn" onclick="addToCart(${i})">ADICIONAR AO CARRINHO</button>
                    </div>
                </div>
            `).join('');
            dotsEl.innerHTML = prods.map((_, i) =>
                `<div class="dot ${i === index ? 'active' : ''}" onclick="goTo(${i})"></div>`
            ).join('');
            updateLayout();
        });
        window.goTo = (i) => { index = i; updateLayout(); };
        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            document.getElementById('themeIcon').innerText =
                document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        };
        let startX = 0;
        document.getElementById('viewport').addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        }, { passive: true });
        document.getElementById('viewport').addEventListener('touchend', e => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && index < prods.length - 1) index++;
                else if (diff < 0 && index > 0) index--;
                updateLayout();
            }
        });
        function updateLayout() {
            const slides = document.querySelectorAll('.slide');
            if (!slides.length) return;
            track.style.transform = `translateX(-${index * 100}%)`;
            const color = prods[index]?.cor || '#4a0e2a';
            bgMaster.style.background = color;
            bgCart.style.background = color;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
            slides.forEach((s, i) => {
                const img = s.querySelector('img');
                if (i === index) {
                    s.classList.add('active');
                    if (img) {
                        img.style.animation = 'none';
                        void img.offsetHeight;
                        img.style.animation = '';
                    }
                } else {
                    s.classList.remove('active');
                }
            });
        }
        window.addToCart = (i) => {
            cart.push(prods[i]);
            updateCartUI();
        };
        window.removeFromCart = (i) => {
            cart.splice(i, 1);
            updateCartUI();
        };
        function updateCartUI() {
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
            const list = document.getElementById('cartItems');
            if (!cart.length) {
                list.innerHTML = '<p class="empty-msg">Sua sacola está vazia.</p>';
            } else {
                list.innerHTML = cart.map((item, i) => `
                    <div class="cart-item">
                        <div class="prod-thumb"><img src="${esc(item.foto)}" alt=""></div>
                        <div style="flex-grow:1">
                            <strong>${esc(item.nome)}</strong><br>
                            <small>R$ ${formatPrice(item.preco)}</small>
                        </div>
                        <div style="cursor:pointer;padding:10px" onclick="removeFromCart(${i})">✕</div>
                    </div>
                `).join('');
            }
            const total = cart.reduce((acc, item) => acc + Number(item.preco), 0);
            document.getElementById('totalDisplay').innerText = `R$ ${formatPrice(total)}`;
        }
        window.toggleCart = () => document.getElementById('cartPage').classList.toggle('active');
        window.checkout = () => {
            if (!cart.length) return alert('Seu carrinho está vazio!');
            const numero = '5511965972240';
            let msg = '*Novo Pedido - All Pink Beauty*\n\n';
            cart.forEach(item => { msg += `• ${item.nome} - R$ ${formatPrice(item.preco)}\n`; });
            const total = cart.reduce((acc, item) => acc + Number(item.preco), 0);
            msg += `\n*Total: R$ ${formatPrice(total)}*`;
            window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`);
        };
        updateCartUI();
    </script>
</body>
</html>
