    <style>
        :root {
            --pink-vibrant: #ff2d88;
            --pink-soft: #ffccd5;
            --bg-app: #ffffff;
            --text-main: #000000;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --app-height: 100vh;
            --app-height-fallback: 100dvh;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        body.dark-mode {
            --bg-app: #0f0f0f;
            --text-main: #ffffff;
            --pink-soft: #4a0e2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html {
            background-color: #0f0f0f;
            height: var(--app-height, var(--app-height-fallback));
            min-height: var(--app-height, var(--app-height-fallback));
            max-height: var(--app-height, var(--app-height-fallback));
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }
        html.light-mode { background-color: #ffffff; }
        body {
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            width: 100%;
            height: var(--app-height, var(--app-height-fallback));
            min-height: var(--app-height, var(--app-height-fallback));
            max-height: var(--app-height, var(--app-height-fallback));
            display: flex;
            justify-content: center;
            transition: background 0.5s var(--ease);
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }
        .app-shell {
            width: 100%;
            max-width: 500px;
            height: 100%;
            min-height: 100%;
            background: var(--bg-app);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .bg-layer {
            position: absolute;
            inset: 0;
            background: var(--pink-soft);
            clip-path: polygon(100% 0, 100% 60%, 0 100%, 0 0);
            transition: background 0.8s var(--ease);
            z-index: 1;
        }
        header {
            position: absolute;
            top: 12px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 5000;
        }
        .logo-container { height: 60px; display: flex; align-items: center; }
        .logo-img { max-height: 100%; width: auto; object-fit: contain; }
        .logo-text { font-family: 'Bodoni Moda', serif; font-size: 24px; color: var(--text-main); font-weight: 700; }
        .header-actions { display: flex; gap: 20px; align-items: center; }
        .theme-toggle { cursor: pointer; font-size: 24px; color: var(--text-main); border: none; background: none; }
        .cart-btn { cursor: pointer; position: relative; color: var(--text-main); border: none; background: none; }
        .cart-icon-svg { width: 24px; height: 24px; border: 2px solid currentColor; border-top: none; position: relative; }
        .cart-icon-svg::after {
            content: ''; position: absolute; top: -9px; left: 5px;
            width: 10px; height: 8px; border: 2px solid currentColor;
            border-bottom: none; border-radius: 10px 10px 0 0;
        }
        .badge {
            position: absolute; top: -5px; right: -8px;
            background: var(--pink-vibrant); color: white;
            font-size: 11px; min-width: 20px; height: 20px; padding: 0 4px;
            border-radius: 50%; display: none;
            justify-content: center; align-items: center; font-weight: bold;
        }
        .viewport { width: 100%; height: 100%; position: relative; z-index: 10; overflow: hidden; }
        .track { display: flex; height: 100%; transition: transform 0.6s var(--ease); will-change: transform; }
        .slide {
            min-width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 90px 20px 32px;
            text-align: center;
        }
        .product-frame {
            height: min(45vh, calc(var(--app-height, 100vh) * 0.42));
            width: 100%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .product-frame img {
            max-width: 85%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            opacity: 0; transform: scale(0.3);
        }
        .slide.active img { animation: growIn 0.8s var(--bounce) forwards; }
        @keyframes growIn {
            0% { transform: scale(0.3) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .meta { color: var(--text-main); transition: 0.6s; opacity: 0; transform: translateY(20px); }
        .slide.active .meta { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
        .meta h3 { font-family: 'Bodoni Moda', serif; font-size: 20px; margin-bottom: 6px; }
        .meta .description {
            font-size: 13px;
            font-weight: 300;
            opacity: 0.75;
            line-height: 1.5;
            margin-bottom: 4px;
            max-height: 58px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            padding: 0 10px;
        }
        .meta .description.expanded {
            max-height: none;
            -webkit-line-clamp: unset;
            display: block;
            overflow: visible;
        }
        .read-more-btn {
            background: none;
            border: none;
            color: var(--pink-vibrant);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            padding: 0;
            text-decoration: underline;
            letter-spacing: 0.5px;
        }
        .wa-float {
            position: absolute;
            bottom: 56px;
            right: 16px;
            z-index: 6000;
            width: 52px;
            height: 52px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.45);
            text-decoration: none;

        .wa-float:active { transform: scale(0.92); }
        .wa-float svg { width: 28px; height: 28px; fill: white; }
        .install-banner {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9000;
            background: var(--bg-app);
            border-top: 2px solid var(--pink-vibrant);
            padding: 16px 20px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.4s var(--ease);

        .install-banner.show { display: flex; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .install-banner-text { flex: 1; text-align: left; color: var(--text-main); font-size: 13px; line-height: 1.4; }
        .install-banner-text strong { display: block; font-size: 14px; margin-bottom: 2px; }
        .install-banner-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .install-btn {
            background: var(--pink-vibrant);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .install-dismiss {
            background: none;
            border: none;
            color: var(--text-main);
            opacity: 0.5;
            font-size: 12px;
            cursor: pointer;
            padding: 4px;
        }
        .price { color: var(--pink-vibrant); font-weight: 600; font-size: 22px; display: block; margin-bottom: 16px; }
        .add-btn {
            background: var(--text-main); color: var(--bg-app);
            border: none; padding: 20px; width: 280px;
            font-size: 14px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; border-radius: 4px;
        }
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 30; width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--text-main); background: var(--bg-app);
            color: var(--text-main); font-size: 28px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0.6; transition: opacity 0.2s;
        }
        .nav-btn:hover { opacity: 1; }
        .nav-btn:disabled { opacity: 0.15; cursor: default; }
        .nav-prev { left: 12px; }
        .nav-next { right: 12px; }
        .dots {
            position: absolute;
            bottom: 16px;
            left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px; z-index: 20;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-main); opacity: 0.25;
            transition: 0.3s var(--ease); border: none; padding: 0; cursor: pointer;
        }
        .dot.active { opacity: 1; transform: scale(1.2); background: var(--pink-vibrant); }
        .cart-page {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg-app); z-index: 10000;
            transition: 0.5s var(--ease);
            padding: 80px 25px 24px;
            display: flex; flex-direction: column;
        }
        .cart-page.active { right: 0; }
        .cart-page .bg-layer { opacity: 0.5; pointer-events: none; }
        .close-x {
            position: absolute;
            top: 24px;
            right: 20px;
            font-size: 40px; cursor: pointer; color: var(--text-main); z-index: 10;
            border: none; background: none;
        }
        .cart-content {
            position: relative; z-index: 5; height: 100%;
            display: flex; flex-direction: column; color: var(--text-main);
        }
        .cart-list { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.1);
        }
        .prod-thumb {
            width: 60px; height: 60px; background: #fff;
            border-radius: 8px; overflow: hidden;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .prod-thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .qty-controls {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .qty-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--text-main); background: transparent;
            color: var(--text-main); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-value { min-width: 20px; text-align: center; font-weight: 600; }
        .whatsapp-btn {
            background: #25D366; color: white; border: none;
            padding: 22px; width: 100%; font-weight: 700;
            text-transform: uppercase; border-radius: 8px; font-size: 16px;
            cursor: pointer;
        }
        .clear-cart-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--text-main);
            padding: 12px; width: 100%; font-weight: 600; border-radius: 8px;
            font-size: 13px; cursor: pointer; margin-bottom: 12px; text-transform: uppercase;
        }
        .empty-msg { opacity: 0.5; text-align: center; margin-top: 40px; }
        .loading-msg { opacity: 0.7; text-align: center; margin-top: 40px; font-size: 14px; }
        .error-msg { color: #ff6b6b; text-align: center; margin-top: 40px; font-size: 14px; padding: 0 20px; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const CONFIG = {
            whatsapp: '5511965972240',
            gaId: 'G-DHJ2CMV2ZC'
        };

        const waMsg = encodeURIComponent('Olá! Vim pelo catálogo All Pink Beauty e gostaria de mais informações.');
        const waFloat = document.getElementById('waFloat');
        waFloat.href = `https://wa.me/${CONFIG.whatsapp}?text=${waMsg}`;
        waFloat.addEventListener('click', () => {
            if (CONFIG.gaId && typeof gtag === 'function') gtag('event', 'contact_whatsapp');
        });

        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.app",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52"
        };

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str ?? '';
            return d.innerHTML;
        }

        function formatPrice(n) {
            return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let prods = [];
        let cart = loadCart();
        let index = 0;

        const track = document.getElementById('track');
        const dotsEl = document.getElementById('dots');
        const badge = document.getElementById('badge');
        const bgMaster = document.getElementById('bg-master');
        const bgCart = document.getElementById('bg-cart');
        const navPrev = document.getElementById('navPrev');
        const navNext = document.getElementById('navNext');

        function loadCart() {
            try {
                const saved = localStorage.getItem('allpink-cart');
                if (!saved) return {};
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) || typeof parsed !== 'object') return {};
                return parsed;
            } catch {
                return {};
            }
        }

        function saveCart() {
            localStorage.setItem('allpink-cart', JSON.stringify(cart));
        }

        function cartCount() {
            return Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
        }

        function cartTotal() {
            return Object.values(cart).reduce((sum, item) => sum + Number(item.preco) * item.qty, 0);
        }

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            if (!data) {
                track.innerHTML = '<p class="empty-msg">Nenhum produto cadastrado.</p>';
                dotsEl.innerHTML = '';
                navPrev.disabled = true;
                navNext.disabled = true;
                return;
            }
            prods = Object.entries(data)
                .map(([id, p]) => ({ id, ...p }))
                .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

            if (index >= prods.length) index = 0;

            track.innerHTML = prods.map((p, i) => `
                <div class="slide ${i === index ? 'active' : ''}" data-bg="${esc(p.cor || '#4a0e2a')}">
                    <div class="product-frame"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy"></div>
                    <div class="meta">
                        <h3>${esc(p.nome)}</h3>
                        ${p.descricao ? `
                            <p class="description" id="desc-${esc(p.id)}">${esc(p.descricao)}</p>
                            ${p.descricao.length > 85 ? `<button type="button" class="read-more-btn" onclick="toggleDesc('${esc(p.id)}')">Ler mais</button>` : ''}
                        ` : ''}
                        <span class="price">R$ ${formatPrice(p.preco)}</span>
                        <button type="button" class="add-btn" onclick="addToCart('${esc(p.id)}')">ADICIONAR AO CARRINHO</button>
                    </div>
                </div>
            `).join('');

            dotsEl.innerHTML = prods.map((_, i) =>
                `<button type="button" class="dot ${i === index ? 'active' : ''}" onclick="goTo(${i})" aria-label="Produto ${i + 1}"></button>`
            ).join('');

            updateLayout();
        }, (err) => {
            console.error(err);
            track.innerHTML = '<p class="error-msg">Erro ao carregar produtos. Verifique sua conexão com a internet.</p>';
            navPrev.disabled = true;
            navNext.disabled = true;
        });

        window.goTo = (i) => {
            index = i;
            updateLayout();
        };

        window.navigate = (delta) => {
            const next = index + delta;
            if (next >= 0 && next < prods.length) {
                index = next;
                updateLayout();
            }
        };

        window.toggleDesc = (id) => {
            const el = document.getElementById('desc-' + id);
            const btn = el?.nextElementSibling;
            if (!el) return;
            el.classList.toggle('expanded');
            if (btn?.classList.contains('read-more-btn')) {
                btn.textContent = el.classList.contains('expanded') ? 'Ver menos' : 'Ler mais';
            }
        };

        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.documentElement.classList.toggle('light-mode', !isDark);
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('allpink-theme', isDark ? 'dark' : 'light');
        };

        const savedTheme = localStorage.getItem('allpink-theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
            document.documentElement.classList.add('light-mode');
            document.getElementById('themeIcon').textContent = '🌙';
        }

        let startX = 0;
        document.getElementById('viewport').addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        }, { passive: true });

        document.getElementById('viewport').addEventListener('touchend', e => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) navigate(1);
                else navigate(-1);
            }
        });

        document.addEventListener('keydown', e => {
            if (document.getElementById('cartPage').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        function updateLayout() {
            const slides = document.querySelectorAll('.slide');
            if (!slides.length) return;

            track.style.transform = `translateX(-${index * 100}%)`;
            const color = prods[index]?.cor || '#4a0e2a';
            bgMaster.style.background = color;
            bgCart.style.background = color;

            navPrev.disabled = index === 0;
            navNext.disabled = index >= prods.length - 1;

            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));

            slides.forEach((s, i) => {
                const img = s.querySelector('img');
                if (i === index) {
                    s.classList.add('active');
                    if (img) {
                        img.style.animation = 'none';
                        void img.offsetHeight;
                        img.style.animation = '';
                    }
                } else {
                    s.classList.remove('active');
                }
            });
        }

        window.addToCart = (id) => {
            const p = prods.find(x => x.id === id);
            if (!p) return;
            if (cart[id]) cart[id].qty++;
            else cart[id] = { id: p.id, nome: p.nome, preco: p.preco, foto: p.foto, qty: 1 };
            saveCart();
            updateCartUI();
            if (CONFIG.gaId && typeof gtag === 'function') {
                gtag('event', 'add_to_cart', { item_id: id, item_name: p.nome, value: p.preco });
            }
        };

        window.changeQty = (id, delta) => {
            if (!cart[id]) return;
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];
            saveCart();
            updateCartUI();
        };

        window.clearCart = () => {
            if (!cartCount()) return;
            if (confirm('Limpar todos os itens do carrinho?')) {
                cart = {};
                saveCart();
                updateCartUI();
            }
        };

        function updateCartUI() {
            const count = cartCount();
            badge.textContent = count;
            badge.style.display = count > 0 ? 'flex' : 'none';

            const list = document.getElementById('cartItems');
            const items = Object.values(cart);

            document.getElementById('clearCartBtn').style.display = items.length ? 'block' : 'none';

            if (!items.length) {
                list.innerHTML = '<p class="empty-msg">Sua sacola está vazia.</p>';
            } else {
                list.innerHTML = items.map(item => `
                    <div class="cart-item">
                        <div class="prod-thumb"><img src="${esc(item.foto)}" alt="${esc(item.nome)}"></div>
                        <div style="flex-grow:1; min-width:0;">
                            <strong>${esc(item.nome)}</strong><br>
                            <small>R$ ${formatPrice(item.preco)}</small>
                        </div>
                        <div class="qty-controls">
                            <button type="button" class="qty-btn" onclick="changeQty('${esc(item.id)}', -1)" aria-label="Diminuir">−</button>
                            <span class="qty-value">${item.qty}</span>
                            <button type="button" class="qty-btn" onclick="changeQty('${esc(item.id)}', 1)" aria-label="Aumentar">+</button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('totalDisplay').textContent = `R$ ${formatPrice(cartTotal())}`;
        }

        window.toggleCart = () => document.getElementById('cartPage').classList.toggle('active');

        window.checkout = () => {
            const items = Object.values(cart);
            if (!items.length) return alert('Seu carrinho está vazio!');
            let msg = '*Novo Pedido - All Pink Beauty*\n\n';
            items.forEach(item => {
                const sub = Number(item.preco) * item.qty;
                msg += `• ${item.nome} x${item.qty} - R$ ${formatPrice(sub)}\n`;
            });
            msg += `\n*Total: R$ ${formatPrice(cartTotal())}*`;
            if (CONFIG.gaId && typeof gtag === 'function') gtag('event', 'checkout_whatsapp', { value: cartTotal() });
            window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`);
        };

        /* Banner instalar app (PWA) */
        let deferredInstallPrompt = null;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const installText = document.getElementById('installText');

        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function showInstallBanner() {
            if (localStorage.getItem('allpink-install-dismissed') || isStandalone()) return;
            if (isIOS()) {
                installText.textContent = 'Toque em Compartilhar → "Adicionar à Tela de Início".';
                installBtn.textContent = 'Entendi';
            }
            document.getElementById('waFloat').style.bottom = '110px';
            installBanner.classList.add('show');
        }

        function dismissInstall() {
            installBanner.classList.remove('show');
            document.getElementById('waFloat').style.bottom = '';
            localStorage.setItem('allpink-install-dismissed', '1');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            if (!localStorage.getItem('allpink-install-dismissed') && !isStandalone()) {
                installText.textContent = 'Instale na tela inicial para acesso rápido.';
                installBtn.textContent = 'Instalar';
                setTimeout(showInstallBanner, 2500);
            }
        });

        installBtn.addEventListener('click', async () => {
            if (isIOS()) { dismissInstall(); return; }
            if (!deferredInstallPrompt) { dismissInstall(); return; }
            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            dismissInstall();
        });

        document.getElementById('installDismiss').addEventListener('click', dismissInstall);

        if (isIOS() && !localStorage.getItem('allpink-install-dismissed') && !isStandalone()) {
            setTimeout(showInstallBanner, 3000);
        }

        updateCartUI();
    </script>
</body>
</html>
