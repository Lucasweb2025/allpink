<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Pink Beauty | Luxury Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink-vibrant: #ff2d88; --pink-soft: #ffccd5; --bg-app: #ffffff; --text-main: #000000; }
        body.dark-mode { --bg-app: #0f0f0f; --text-main: #ffffff; --pink-soft: #4a0e2a; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-app); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; color: var(--text-main); transition: 0.5s; }
        .app-shell { width: 100%; max-width: 500px; height: 100vh; position: relative; margin: auto; overflow: hidden; }
        .bg-layer { position: absolute; top: 0; width: 100%; height: 100%; background: var(--pink-soft); clip-path: polygon(100% 0, 100% 60%, 0 100%, 0 0); z-index: 1; transition: 0.8s; }
        header { position: absolute; top: 40px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; z-index: 5000; }
        .track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide { min-width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; z-index: 10; }
        .slide img { max-width: 80%; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.2)); }
        .price { color: var(--pink-vibrant); font-weight: 600; font-size: 24px; margin: 15px 0; }
        .add-btn { background: var(--text-main); color: var(--bg-app); border: none; padding: 20px; width: 280px; font-weight: 700; border-radius: 4px; cursor: pointer; }
        .cart-page { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: var(--bg-app); z-index: 10000; transition: 0.5s; padding: 100px 25px; }
        .cart-page.active { right: 0; }
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 22px; width: 100%; font-weight: 700; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body class="dark-mode">
    <div class="app-shell">
        <div class="bg-layer" id="bg-master"></div>
        <header>
            <div style="font-family:'Bodoni Moda'; font-size:24px;">All Pink Beauty</div>
            <div onclick="toggleCart()" style="position:relative; cursor:pointer;">🛒 <span id="badge" style="position:absolute; top:-10px; right:-10px; background:var(--pink-vibrant); color:white; font-size:11px; width:20px; height:20px; border-radius:50%; display:none; align-items:center; justify-content:center;">0</span></div>
        </header>

        <div class="track" id="track"></div>

        <div class="cart-page" id="cartPage">
            <h2 style="font-family:'Bodoni Moda'; font-size:30px;">Minha Sacola</h2>
            <div id="cartItems" style="margin: 30px 0; max-height: 50vh; overflow-y: auto;"></div>
            <p style="font-weight:bold;">TOTAL: <span id="totalDisplay">R$ 0,00</span></p>
            <button class="whatsapp-btn" onclick="checkout()">FINALIZAR NO WHATSAPP</button>
            <p onclick="toggleCart()" style="text-align:center; margin-top:20px; cursor:pointer;">Voltar</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { /* Cole suas chaves aqui */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let index = 0, cart = [], produtosAtivos = [];

        onValue(ref(db, 'produtos'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            // Filtro: Apenas produtos com estoque > 0
            produtosAtivos = Object.keys(data).map(id => ({id, ...data[id]})).filter(p => (p.estoque || 0) > 0);
            render();
        });

        function render() {
            const track = document.getElementById('track');
            track.innerHTML = produtosAtivos.map((p, i) => `
                <div class="slide">
                    <img src="${p.foto}">
                    <h3 style="margin-top:20px;">${p.nome}</h3>
                    <div class="price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
                    <button class="add-btn" onclick="addToCart(${i})">ADICIONAR À SACOLA</button>
                </div>
            `).join('');
            update();
        }

        window.addToCart = (i) => { cart.push(produtosAtivos[i]); updateUI(); };
        function updateUI() {
            const badge = document.getElementById('badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
            const total = cart.reduce((acc, p) => acc + p.preco, 0);
            document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('cartItems').innerHTML = cart.map(p => `<p style="margin-bottom:10px">${p.nome} - R$ ${p.preco.toFixed(2)}</p>`).join('');
        }

        function update() {
            document.getElementById('track').style.transform = `translateX(-${index * 100}%)`;
            document.getElementById('bg-master').style.background = produtosAtivos[index]?.cor || '#ffccd5';
        }

        window.toggleCart = () => document.getElementById('cartPage').classList.toggle('active');
        window.checkout = () => {
            const msg = encodeURIComponent(`*Novo Pedido*\n${cart.map(p => `• ${p.nome}`).join('\n')}\n\n*Total: R$ ${cart.reduce((a,b)=>a+b.preco,0).toFixed(2)}*`);
            window.open(`https://wa.me/5511965972240?text=${msg}`);
        };

        let x = 0;
        document.body.addEventListener('touchstart', e => x = e.touches[0].clientX);
        document.body.addEventListener('touchend', e => {
            const d = x - e.changedTouches[0].clientX;
            if(Math.abs(d) > 50) {
                if(d > 0 && index < produtosAtivos.length-1) index++;
                else if(d < 0 && index > 0) index--;
                update();
            }
        });
    </script>
</body>
</html>
