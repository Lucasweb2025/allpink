<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | All Pink</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #ff2d88; color: white; font-weight: bold; cursor: pointer; }
        .product { display: flex; align-items: center; gap: 10px; background: #222; padding: 10px; margin-top: 5px; border-radius: 5px; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="login">
        <input type="password" id="pass" placeholder="Senha do Painel">
        <button onclick="entrar()">ENTRAR</button>
    </div>

    <div id="conteudo" style="display:none;" class="card">
        <h2>Cadastrar Produto</h2>
        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="preco" placeholder="Preço" step="0.01">
        <input type="text" id="cor" placeholder="Cor de Fundo (#ffccd5)">
        <input type="number" id="estoque" placeholder="Estoque Inicial" value="1">
        <input type="file" id="foto" accept="image/*">
        <button onclick="salvar()">CADASTRAR</button>
        <hr>
        <div id="lista"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { /* Mesmas chaves */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.entrar = () => {
            if(document.getElementById('pass').value === 'allpink2026') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('conteudo').style.display = 'block';
            }
        };

        window.salvar = () => {
            const file = document.getElementById('foto').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                push(ref(db, 'produtos'), {
                    nome: document.getElementById('nome').value,
                    preco: parseFloat(document.getElementById('preco').value),
                    cor: document.getElementById('cor').value,
                    estoque: parseInt(document.getElementById('estoque').value),
                    foto: e.target.result
                });
                alert("Salvo!");
            };
            reader.readAsDataURL(file);
        };

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            const lista = document.getElementById('lista');
            lista.innerHTML = "";
            if(data) Object.keys(data).forEach(id => {
                lista.innerHTML += `<div class="product"><img src="${data[id].foto}"> <span>${data[id].nome}</span> <button onclick="deletar('${id}')" style="width:auto; padding:5px; background:red;">X</button></div>`;
            });
        });

        window.deletar = (id) => { if(confirm("Excluir?")) remove(ref(db, `produtos/${id}`)); };
    </script>
</body>
</html>
