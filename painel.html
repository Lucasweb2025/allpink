<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | All Pink Beauty</title>
    <link rel="icon" href="./icone.svg" type="image/svg+xml">
    <style>
        :root { --pink: #ff2d88; --bg: #0f0f0f; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; text-align: center; }
        input, button, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        input, textarea { background: #222; color: white; border: 1px solid #333; }
        textarea { resize: vertical; min-height: 60px; font-family: inherit; }
        button { background: var(--pink); color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        button.secondary { background: #333; }
        button.danger { background: #c0392b; width: auto; padding: 8px 12px; margin: 0; font-size: 14px; }
        .product-item {
            background: #1a1a1a; padding: 12px; border-radius: 10px;
            display: flex; align-items: center; gap: 12px; margin-top: 10px; text-align: left;
        }
        .product-item img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
        .product-info { flex-grow: 1; min-width: 0; }
        .product-info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .product-actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .order-btns { display: flex; gap: 4px; }
        .order-btns button { width: 32px; padding: 4px; margin: 0; font-size: 14px; background: #444; }
        .auth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .auth-header span { font-size: 13px; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; }
        .error-msg { color: #ff6b6b; font-size: 14px; margin: 8px 0; min-height: 20px; }
        .status-msg { color: #7bed9f; font-size: 14px; margin: 8px 0; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:var(--pink); margin-bottom:20px;">Cadastro All Pink</h2>

        <div id="loginBox">
            <input type="email" id="email" placeholder="E-mail do administrador" autocomplete="username">
            <input type="password" id="pass" placeholder="Senha" autocomplete="current-password">
            <p class="error-msg" id="loginError"></p>
            <p class="status-msg" id="loginStatus"></p>
            <button type="button" id="btnEntrar">ENTRAR</button>
        </div>

        <div id="form" style="display:none;">
            <div class="auth-header">
                <span id="userEmail"></span>
                <button type="button" class="secondary" id="btnSair" style="width:auto;padding:8px 16px;margin:0;">SAIR</button>
            </div>
            <input type="text" id="nome" placeholder="Nome do Produto">
            <textarea id="descricao" placeholder="Descrição / Subtítulo (opcional)" rows="2"></textarea>
            <input type="number" id="preco" placeholder="Preço" step="0.01" min="0">
            <input type="text" id="cor" placeholder="Cor de Fundo (Ex: #4a0e2a)">
            <input type="file" id="foto" accept="image/*">
            <button type="button" id="btnSalvar">CADASTRAR PRODUTO</button>
            <div id="lista" style="margin-top:20px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.app",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52"
        };

        const IMGBB_API_KEY = "72fb04220922c06b3b6fea61b6bf4c9c";

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str ?? '';
            return d.innerHTML;
        }

        function formatPrice(n) {
            return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let produtosCache = [];

        const loginError = document.getElementById('loginError');
        const loginStatus = document.getElementById('loginStatus');

        function showError(msg) {
            loginError.textContent = msg;
            loginStatus.textContent = '';
        }

        function showStatus(msg) {
            loginStatus.textContent = msg;
            loginError.textContent = '';
        }

        function showLogin() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('form').style.display = 'none';
        }

        function showPanel(user) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('form').style.display = 'block';
            document.getElementById('userEmail').textContent = user.email;
            loginError.textContent = '';
            loginStatus.textContent = '';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) showPanel(user);
            else showLogin();
        });

        async function entrar() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value;
            const btn = document.getElementById('btnEntrar');

            if (!email || !password) {
                showError('Preencha e-mail e senha.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'ENTRANDO...';
            showStatus('Conectando...');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showStatus('Login realizado!');
            } catch (e) {
                console.error(e);
                const code = e?.code || '';
                if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
                    showError('E-mail ou senha incorretos.');
                } else if (code === 'auth/invalid-email') {
                    showError('E-mail inválido.');
                } else if (code === 'auth/too-many-requests') {
                    showError('Muitas tentativas. Aguarde alguns minutos.');
                } else if (code === 'auth/network-request-failed') {
                    showError('Sem conexão com a internet.');
                } else {
                    showError('Erro ao entrar: ' + (e.message || code || 'desconhecido'));
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'ENTRAR';
            }
        }

        document.getElementById('btnEntrar').addEventListener('click', entrar);
        document.getElementById('pass').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrar();
        });
        document.getElementById('email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrar();
        });
        document.getElementById('btnSair').addEventListener('click', () => signOut(auth));

        async function nextOrdem() {
            const snap = await get(ref(db, 'produtos'));
            const data = snap.val() || {};
            return Object.values(data).reduce((max, p) => Math.max(max, p.ordem ?? 0), 0) + 1;
        }

        async function uploadFoto(file) {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const result = await res.json();
            if (!result.success) throw new Error("Falha no upload da foto");
            return result.data.url;
        }

        async function salvar() {
            const file = document.getElementById('foto').files[0];
            const nome = document.getElementById('nome').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const preco = parseFloat(document.getElementById('preco').value);
            const cor = document.getElementById('cor').value.trim() || '#4a0e2a';
            const btnSalvar = document.getElementById('btnSalvar');

            if (!file || !nome || isNaN(preco) || preco <= 0) {
                return alert('Preencha nome, preço válido e selecione uma foto.');
            }

            btnSalvar.textContent = 'ENVIANDO FOTO, AGUARDE...';
            btnSalvar.disabled = true;

            try {
                const urlFoto = await uploadFoto(file);
                const ordem = await nextOrdem();
                const produto = { nome, preco, cor, foto: urlFoto, ordem };
                if (descricao) produto.descricao = descricao;
                await push(ref(db, 'produtos'), produto);
                alert('Produto cadastrado com sucesso!');
                document.getElementById('nome').value = '';
                document.getElementById('descricao').value = '';
                document.getElementById('preco').value = '';
                document.getElementById('cor').value = '';
                document.getElementById('foto').value = '';
            } catch (err) {
                console.error(err);
                alert('Erro ao cadastrar. Verifique login e regras do banco no Firebase.');
            } finally {
                btnSalvar.textContent = 'CADASTRAR PRODUTO';
                btnSalvar.disabled = false;
            }
        }

        document.getElementById('btnSalvar').addEventListener('click', salvar);

        function renderLista() {
            const list = document.getElementById('lista');
            if (!produtosCache.length) {
                list.innerHTML = '<p style="opacity:0.5;">Nenhum produto cadastrado.</p>';
                return;
            }

            list.innerHTML = produtosCache.map((p, idx) => `
                <div class="product-item">
                    <img src="${esc(p.foto)}" alt="${esc(p.nome)}">
                    <div class="product-info">
                        <b>${esc(p.nome)}</b>
                        ${p.descricao ? `<small style="opacity:0.6;display:block;margin:2px 0;">${esc(p.descricao).substring(0,50)}${p.descricao.length > 50 ? '...' : ''}</small>` : ''}
                        R$ ${formatPrice(p.preco)}
                        <small style="opacity:0.5;display:block;">Ordem: ${p.ordem ?? 0}</small>
                    </div>
                    <div class="product-actions">
                        <div class="order-btns">
                            <button type="button" data-mover="${esc(p.id)}" data-dir="-1" ${idx === 0 ? 'disabled' : ''} title="Subir">▲</button>
                            <button type="button" data-mover="${esc(p.id)}" data-dir="1" ${idx === produtosCache.length - 1 ? 'disabled' : ''} title="Descer">▼</button>
                        </div>
                        <button type="button" class="danger" data-delete="${esc(p.id)}">X</button>
                    </div>
                </div>
            `).join('');

            list.querySelectorAll('[data-mover]').forEach(btn => {
                btn.addEventListener('click', () => mover(btn.dataset.mover, Number(btn.dataset.dir)));
            });
            list.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', () => deletar(btn.dataset.delete));
            });
        }

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            produtosCache = data
                ? Object.entries(data).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0))
                : [];
            renderLista();
        });

        async function mover(id, direction) {
            const idx = produtosCache.findIndex(p => p.id === id);
            const swapIdx = idx + direction;
            if (idx < 0 || swapIdx < 0 || swapIdx >= produtosCache.length) return;

            const current = produtosCache[idx];
            const swap = produtosCache[swapIdx];
            try {
                await update(ref(db), {
                    [`produtos/${current.id}/ordem`]: swap.ordem ?? swapIdx,
                    [`produtos/${swap.id}/ordem`]: current.ordem ?? idx
                });
            } catch (err) {
                console.error(err);
                alert('Erro ao reordenar.');
            }
        }

        function deletar(id) {
            if (confirm('Excluir produto?')) {
                remove(ref(db, `produtos/${id}`)).catch(err => {
                    console.error(err);
                    alert('Erro ao excluir.');
                });
            }
        }
    </script>
</body>
</html>
