<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | All Pink Beauty</title>
    <style>
        :root { --pink: #ff2d88; --bg: #0f0f0f; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        input { background: #222; color: white; border: 1px solid #333; }
        button { background: var(--pink); color: white; font-weight: bold; cursor: pointer; }
        .product-item { background: #1a1a1a; padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 15px; margin-top: 10px; text-align: left; }
        .product-item img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:var(--pink); margin-bottom:20px;">Cadastro All Pink</h2>
        <input type="password" id="pass" placeholder="Senha do Painel">
        <div id="form" style="display:none;">
            <input type="text" id="nome" placeholder="Nome do Produto">
            <input type="number" id="preco" placeholder="Preço" step="0.01">
            <input type="text" id="cor" placeholder="Cor de Fundo (Ex: #4a0e2a)">
            <input type="text" id="fotoUrl" placeholder="Link da Imagem (URL)">
            <button onclick="salvar()">CADASTRAR PRODUTO</button>
            <div id="lista" style="margin-top:20px;"></div>
        </div>
        <button id="btnEntrar" onclick="entrar()">ENTRAR</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.app",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.entrar = () => {
            if(document.getElementById('pass').value === 'allpink2026') {
                document.getElementById('form').style.display = 'block';
                document.getElementById('pass').style.display = 'none';
                document.getElementById('btnEntrar').style.display = 'none';
            }
        };

        window.salvar = () => {
            const nome = document.getElementById('nome').value;
            const preco = parseFloat(document.getElementById('preco').value);
            const cor = document.getElementById('cor').value || '#4a0e2a';
            const foto = document.getElementById('fotoUrl').value;

            if(!nome || !preco || !foto) return alert("Preencha todos os campos!");

            // Salva o link direto no Realtime Database (rápido e leve)
            push(ref(db, 'produtos'), {
                nome: nome,
                preco: preco,
                cor: cor,
                foto: foto
            }).then(() => {
                alert("Produto cadastrado!");
                document.getElementById('nome').value = "";
                document.getElementById('preco').value = "";
                document.getElementById('fotoUrl').value = "";
            }).catch(err => alert("Erro ao salvar: " + err.message));
        };

        onValue(ref(db, 'produtos'), (snap) => {
            const list = document.getElementById('lista');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(id => {
                list.innerHTML += `<div class="product-item"><img src="${data[id].foto}"> <div><b>${data[id].nome}</b><br>R$ ${data[id].preco.toFixed(2)}</div><button onclick="deletar('${id}')" style="width:auto; padding:5px 10px; background:red; margin-left:auto; color:white; border-radius:5px;">X</button></div>`;
            });
        });

        window.deletar = (id) => { if(confirm("Excluir produto?")) remove(ref(db, `produtos/${id}`)); };
    </script>
</body>
</html>
