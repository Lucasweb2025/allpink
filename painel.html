<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | All Pink Beauty</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink-vibrant: #ff2d88; --pink-soft: #ffccd5; --bg-app: #0f0f0f; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-app); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px 0; }
        
        /* TELA DE LOGIN */
        .login-shell { width: 100%; max-width: 400px; padding: 40px 25px; text-align: center; margin-top: 10vh; }
        .login-shell h2 { font-family: 'Bodoni Moda', serif; font-size: 32px; color: var(--pink-vibrant); margin-bottom: 20px; }
        .login-shell input { margin-bottom: 15px; text-align: center; }

        /* PAINEL (Inicia escondido) */
        .admin-shell { width: 100%; max-width: 500px; padding: 20px 25px; display: none; }
        
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: 'Bodoni Moda', serif; font-size: 32px; color: var(--pink-vibrant); margin-bottom: 5px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; color: var(--pink-soft); }
        input[type="text"], input[type="number"], input[type="password"] { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--pink-vibrant); }
        .color-picker-wrap { display: flex; align-items: center; gap: 15px; }
        input[type="color"] { width: 50px; height: 50px; border: none; border-radius: 8px; background: none; }
        .upload-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; position: relative; }
        .upload-box img { max-width: 100%; max-height: 200px; display: none; margin: 0 auto; }
        input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .save-btn { background: var(--pink-vibrant); color: white; border: none; padding: 20px; width: 100%; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 8px; margin-top: 10px; }
        
        .catalog-section { margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; }
        .catalog-section h2 { font-family: 'Bodoni Moda', serif; font-size: 24px; color: var(--pink-soft); margin-bottom: 20px; }
        .product-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .product-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; }
        .product-info { flex-grow: 1; margin-left: 15px; }
        .delete-btn { background: #ff3b3b; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-shell" id="loginScreen">
        <h2>Acesso Restrito</h2>
        <p style="opacity: 0.7; margin-bottom: 30px;">Digite a senha para gerenciar o catálogo</p>
        <input type="password" id="senhaInput" placeholder="Senha de acesso">
        <button class="save-btn" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <div class="admin-shell" id="adminContent">
        <header>
            <h1>Painel Allpink</h1>
            <p style="opacity: 0.7;">Gerenciamento de Catálogo</p>
        </header>

        <form id="addProdutoForm">
            <div class="form-group"><label>Nome do Produto</label><input type="text" id="nomeProduto" required></div>
            <div class="form-group"><label>Preço (R$)</label><input type="number" id="precoProduto" step="0.01" required></div>
            <div class="form-group"><label>Cor de Fundo</label>
                <div class="color-picker-wrap"><input type="color" id="corProduto" value="#ffccd5"></div>
            </div>
            <div class="form-group"><label>Foto do Produto</label>
                <div class="upload-box">
                    <div id="uploadText">📸 Clique para escolher a foto</div>
                    <img id="imagePreview">
                    <input type="file" id="fotoProduto" accept="image/*" required>
                </div>
            </div>
            <button type="submit" class="save-btn">SALVAR NO APLICATIVO</button>
        </form>

        <div class="catalog-section">
            <h2>Catálogo Atual</h2>
            <div id="listaProdutos">
                <p style="opacity: 0.5;">Carregando produtos...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // COLOQUE SUAS CHAVES DO FIREBASE AQUI NOVAMENTE
        const firebaseConfig = {
            apiKey: "AIzaSyDSfj6A4PortbieMelYDPNwZ9rJ84BW7ns",
            authDomain: "all-pink.firebaseapp.com",
            databaseURL: "https://all-pink-default-rtdb.firebaseio.com",
            projectId: "all-pink",
            storageBucket: "all-pink.firebasestorage.app",
            messagingSenderId: "932996264727",
            appId: "1:932996264727:web:fe800602542154f753bd52",
            measurementId: "G-BB83D3BRNW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SISTEMA DE LOGIN SIMPLES ---
        window.verificarSenha = function() {
            const senhaDigitada = document.getElementById('senhaInput').value;
            
            // VOCÊ PODE MUDAR A SENHA AQUI ABAIXO:
            if(senhaDigitada === "allpink2026") { 
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else {
                alert("Senha incorreta! Tente novamente.");
            }
        };

        // --- LÓGICA DE UPLOAD DE IMAGEM ---
        let imagemBase64 = "";
        document.getElementById('fotoProduto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                imagemBase64 = event.target.result;
                document.getElementById('imagePreview').src = imagemBase64;
                document.getElementById('imagePreview').style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        // --- LÓGICA DE ADICIONAR PRODUTO ---
        document.getElementById('addProdutoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('#addProdutoForm .save-btn');
            btn.innerText = "SALVANDO...";
            
            const novoProduto = {
                nome: document.getElementById('nomeProduto').value,
                preco: parseFloat(document.getElementById('precoProduto').value),
                cor: document.getElementById('corProduto').value,
                foto: imagemBase64
            };

            try {
                await push(ref(db, 'produtos'), novoProduto);
                document.getElementById('addProdutoForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('uploadText').style.display = 'block';
                imagemBase64 = "";
                btn.innerText = "SALVAR NO APLICATIVO";
            } catch (error) {
                alert("Erro ao salvar: " + error.message);
                btn.innerText = "TENTAR NOVAMENTE";
            }
        });

        // --- LÓGICA DE LISTAR E EXCLUIR PRODUTOS ---
        const produtosRef = ref(db, 'produtos');
        onValue(produtosRef, (snapshot) => {
            const data = snapshot.val();
            const listaElement = document.getElementById('listaProdutos');
            
            if (data) {
                listaElement.innerHTML = Object.keys(data).map(key => {
                    const p = data[key];
                    return `
                        <div class="product-item">
                            <img src="${p.foto}" style="background-color: ${p.cor}">
                            <div class="product-info">
                                <strong>${p.nome}</strong><br>
                                <small>R$ ${p.preco.toFixed(2).replace('.', ',')}</small>
                            </div>
                            <button class="delete-btn" onclick="deletarProduto('${key}')">Excluir</button>
                        </div>
                    `;
                }).join('');
            } else {
                listaElement.innerHTML = '<p style="opacity: 0.5;">Nenhum produto cadastrado ainda.</p>';
            }
        });

        window.deletarProduto = async function(idDoProduto) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                try {
                    await remove(ref(db, `produtos/${idDoProduto}`));
                } catch (error) {
                    alert("Erro ao excluir: " + error.message);
                }
            }
        };

    </script>
</body>
</html>
