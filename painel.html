<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | All Pink Beauty</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink-vibrant: #ff2d88; --pink-soft: #ffccd5; --bg-app: #0f0f0f; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-app); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        input, button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; font-size: 16px; }
        input { background: #333; color: white; }
        button { background: var(--pink-vibrant); color: white; font-weight: bold; cursor: pointer; }
        .product-item { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border: 1px solid #333; }
        .product-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .info { flex-grow: 1; }
        .delete-btn { width: auto; padding: 8px 15px; background: #e74c3c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-family:'Bodoni Moda'; color:var(--pink-vibrant); text-align:center; margin-bottom:30px;">QG All Pink Beauty</h2>
        
        <div class="card">
            <h3>Cadastrar Novo Produto</h3>
            <input type="text" id="nomeProduto" placeholder="Nome do Produto">
            <input type="number" id="precoProduto" placeholder="Preço (Ex: 29.99)" step="0.01">
            <input type="text" id="corProduto" placeholder="Cor de Fundo (Ex: #ffccd5)">
            <input type="number" id="estoqueProduto" placeholder="Estoque Inicial" value="1">
            <input type="file" id="fotoProduto" accept="image/*">
            <button onclick="salvarProduto()">SALVAR PRODUTO</button>
        </div>

        <h3>Produtos no Ar</h3>
        <div id="listaProdutos" style="margin-top:20px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Cole aqui sua FirebaseConfig que você já tem
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "all-pink-beauty.firebaseapp.com",
            databaseURL: "https://all-pink-beauty-default-rtdb.firebaseio.com",
            projectId: "all-pink-beauty",
            storageBucket: "all-pink-beauty.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.salvarProduto = async function() {
            const nome = document.getElementById('nomeProduto').value;
            const preco = parseFloat(document.getElementById('precoProduto').value);
            const cor = document.getElementById('corProduto').value;
            const estoque = parseInt(document.getElementById('estoqueProduto').value);
            const fotoInput = document.getElementById('fotoProduto');

            if (!nome || !preco || !fotoInput.files[0]) return alert("Preencha tudo!");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const foto = e.target.result;
                await push(ref(db, 'produtos'), { nome, preco, cor, foto, estoque });
                alert("Produto cadastrado!");
                location.reload();
            };
            reader.readAsDataURL(fotoInput.files[0]);
        };

        onValue(ref(db, 'produtos'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('listaProdutos');
            container.innerHTML = "";
            if (data) {
                Object.keys(data).forEach(id => {
                    const p = data[id];
                    container.innerHTML += `
                        <div class="product-item">
                            <img src="${p.foto}">
                            <div class="info">
                                <strong>${p.nome}</strong><br>
                                <small>Estoque: ${p.estoque || 0}</small>
                            </div>
                            <button class="delete-btn" onclick="deletar('${id}')">X</button>
                        </div>
                    `;
                });
            }
        });

        window.deletar = (id) => { if(confirm("Excluir?")) remove(ref(db, `produtos/${id}`)); };
    </script>
</body>
</html>
