<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin Estoque | All Pink</title>
    <style>
        body { background: #f4f4f4; font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { display: flex; align-items: center; gap: 15px; }
        button { width: 40px; height: 40px; border: none; background: #eee; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .esgotado { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Gestão de Estoque</h1>
    <div id="lista"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { /* Mesmas chaves */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const pass = prompt("Senha Admin:");
        if(pass !== "adminallpink2026") window.location.href = "index.html";

        onValue(ref(db, 'produtos'), (snap) => {
            const data = snap.val();
            const lista = document.getElementById('lista');
            lista.innerHTML = "";
            if(data) Object.keys(data).forEach(id => {
                const p = data[id];
                const estoque = p.estoque || 0;
                lista.innerHTML += `
                    <div class="card">
                        <div>
                            <strong>${p.nome}</strong><br>
                            <span class="${estoque <= 0 ? 'esgotado' : ''}">${estoque <= 0 ? 'ESGOTADO (Oculto no site)' : 'Em estoque: ' + estoque}</span>
                        </div>
                        <div class="controls">
                            <button onclick="ajustar('${id}', ${estoque - 1})">-</button>
                            <b>${estoque}</b>
                            <button onclick="ajustar('${id}', ${estoque + 1})">+</button>
                        </div>
                    </div>`;
            });
        });

        window.ajustar = (id, novo) => { if(novo >= 0) update(ref(db, `produtos/${id}`), { estoque: novo }); };
    </script>
</body>
</html>
