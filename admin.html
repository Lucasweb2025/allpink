<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Admin | All Pink Beauty</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink: #ff2d88;
            --dark: #1a1a1a;
            --bg: #f4f4f4;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: var(--dark); display: none; /* Só aparece após a senha */ }

        header {
            background: var(--dark);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--pink);
        }

        .container { padding: 20px; max-width: 600px; margin: auto; }

        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-card h4 { font-size: 11px; text-transform: uppercase; color: #888; }
        .stat-card p { font-size: 22px; font-weight: 700; color: var(--pink); }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .info { flex-grow: 1; }
        .info h3 { font-size: 16px; margin-bottom: 5px; }
        .status-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
        }
        .visible { background: #e8f5e9; color: var(--success); }
        .hidden { background: #ffebee; color: var(--danger); }

        .controls { display: flex; align-items: center; gap: 15px; }
        
        .btn-qty {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: #f0f0f0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-qty:active { background: var(--pink); color: white; transform: scale(0.9); }

        .qty-num { font-weight: 800; font-size: 18px; width: 30px; text-align: center; }

        .blink { color: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .btn-add-new {
            background: var(--dark);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>All Pink Admin</h1>
        <p>Controle de Estoque e Visibilidade</p>
    </header>

    <div class="container">
        <div class="summary">
            <div class="stat-card">
                <h4>No Catálogo</h4>
                <p id="count-visible">0</p>
            </div>
            <div class="stat-card">
                <h4>Ocultos (Esgotados)</h4>
                <p id="count-hidden">0</p>
            </div>
        </div>

        <div id="lista-produtos">
            </div>

        <button class="btn-add-new" onclick="alert('Dica: Use o seu painel de cadastro para novos itens!')">
            + ADICIONAR NOVO ITEM
        </button>
    </div>

    <script>
        // ==========================================
        // 1. SEGURANÇA: TRANCA DE ACESSO
        // ==========================================
        const SENHA_MESTRA = "adminallpink2026"; 
        const acesso = prompt("Digite a senha de Gestora:");

        if (acesso !== SENHA_MESTRA) {
            alert("Senha incorreta! Redirecionando...");
            window.location.href = "index.html";
        } else {
            document.body.style.display = "block";
        }

        // ==========================================
        // 2. CONFIGURAÇÃO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==========================================
        // 3. MONITORAMENTO EM TEMPO REAL
        // ==========================================
        function monitorarEstoque() {
            db.collection("produtos").onSnapshot((querySnapshot) => {
                const container = document.getElementById("lista-produtos");
                container.innerHTML = "";
                
                let visiveis = 0;
                let ocultos = 0;

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const id = doc.id;
                    const isHidden = p.estoque <= 0;

                    if (isHidden) ocultos++; else visiveis++;

                    container.innerHTML += `
                        <div class="product-card" style="${isHidden ? 'opacity: 0.6; border-left: 4px solid #ccc;' : 'border-left: 4px solid var(--pink);'}">
                            <div class="info">
                                <h3>${p.nome}</h3>
                                <span class="status-tag ${isHidden ? 'hidden' : 'visible'}">
                                    ${isHidden ? '🚫 Oculto na Vitrine' : '✅ Visível no Site'}
                                </span>
                                <div style="margin-top: 5px; font-size: 12px; color: #666;">
                                    Disponível: <b class="${p.estoque <= 2 && p.estoque > 0 ? 'blink' : ''}">
                                        ${p.estoque} un.
                                    </b>
                                </div>
                            </div>
                            <div class="controls">
                                <button class="btn-qty" onclick="ajustar('${id}', ${p.estoque - 1})">-</button>
                                <div class="qty-num">${p.estoque}</div>
                                <button class="btn-qty" onclick="ajustar('${id}', ${p.estoque + 1})">+</button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('count-visible').innerText = visiveis;
                document.getElementById('count-hidden').innerText = ocultos;
            });
        }

        function ajustar(id, novoValor) {
            if (novoValor >= 0) {
                db.collection("produtos").doc(id).update({
                    estoque: novoValor
                });
            }
        }

        monitorarEstoque();
    </script>
</body>
</html>
